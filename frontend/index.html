
<!DOCTYPE html>
<html>
<head>
    <title>KathaBook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .login-container > p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        a {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #9b59b6;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        a:hover {
            background-color: #81449a;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>Welcome to KathaBook</h1>
        <p>Manage your money with ease</p>

        <a href="./login/login.html">Login</a>
        <a href="./signup/signup.html">Signup</a>
    </div>

</body>
</html>
